{% extends "_base.html" %}
{% block title %}ثبت نظر{% endblock title %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">ثبت نظر شما</h3>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">ارسال نظر</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
